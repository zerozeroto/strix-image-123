name: pull-strix
on: workflow_dispatch
permissions:
  contents: write   # 关键：授予写权限
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull
        run: docker pull ghcr.io/usestrix/strix-sandbox:1.3.0
      - name: Compress
        run: docker save ghcr.io/usestrix/strix-sandbox:1.3.0 | gzip > strix.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: strix-image
          path: strix.tar.gz
          retention-days: 3
